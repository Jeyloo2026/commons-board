name: Gno tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Gno v1.8.0
        run: |
          mkdir -p "$RUNNER_TEMP/gno"
          cd "$RUNNER_TEMP/gno"
          base=https://github.com/gnolang/gno/releases/download/v1.8.0
          curl -fsSLO "$base/gno_linux_amd64"
          curl -fsSLO "$base/CHECKSUMS.txt"
          grep 'gno_linux_amd64$' CHECKSUMS.txt | sha256sum -c -
          mv gno_linux_amd64 gno
          chmod +x gno
          git clone --depth 1 --branch v1.8.0 https://github.com/gnolang/gno.git source
          test -d source/gnovm/stdlibs/strconv
          echo "$RUNNER_TEMP/gno" >> "$GITHUB_PATH"
          echo "GNOROOT=$RUNNER_TEMP/gno/source" >> "$GITHUB_ENV"
      - name: Test realm
        working-directory: commonsboard
        run: gno test -root-dir "$RUNNER_TEMP/gno/source" .
      - uses: actions/setup-go@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          go-version-file: ${{ runner.temp }}/gno/source/go.mod
          cache: false
      - name: Build Windows testnet client
        if: github.event_name == 'workflow_dispatch'
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          cd "$RUNNER_TEMP/gno/source"
          go build -o "$RUNNER_TEMP/gnokey.exe" ./gno.land/cmd/gnokey
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: gnokey-v1.8.0-windows-amd64
          path: ${{ runner.temp }}/gnokey.exe
          retention-days: 1
